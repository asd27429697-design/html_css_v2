<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠핑 장소</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="bg"></div>
        <div class="content">
          <img src="https://picsum.photos/seed/camp5/250/250" alt="캠핑장 배경" />
          <h1>캠핑장</h1>
          <button class="btn">⌕</button>
        </div>
      </header>
      <main class="main-content">
        <div class="product-grid">
          <section>
            <h2>필터</h2>
            <span>⚙</span>
            <p>청결도순</p>
          </section>
        </div>

        <div class="category-list">
          <div class="category-item">
            <span>🌲</span>
            <p>캠핑장</p>
          </div>

          <div class="category-item">
            <span>🏊</span>
            <p>물놀이장</p>
          </div>

          <div class="category-item">
            <span>🏞️</span>
            <p>계곡 물놀이</p>
          </div>

          <div class="category-item">
            <span>🏖️</span>
            <p>해수욕</p>
          </div>

          <div class="category-item">
            <span>🚐</span>
            <p>차박</p>
          </div>

          <div class="category-item">
            <span>🐶</span>
            <p>반려동물</p>
          </div>
        </div>

        <section>
          <h3>얼클킴스</h3>
          <p>경기 포천시 신북면 금동리 12-4</p>
          <p>★ 5.0</p>
        </section>

        <section>
          <h3>한국스카우트연맹 곤지암야영장</h3>
          <p>경기 광주시 도적면 진우리 884</p>
          <p>★ 5.0</p>
        </section>

        <section>
          <h3>진천포레스트캠핑장</h3>
          <p>충북 진천군 백곡면 구수리 82-25</p>
          <p>★ 5.0</p>
        </section>

        <section>
          <h3>트멍 캠핑장</h3>
          <p>경기 포천시 소흘읍 무림리 94-1</p>
          <p>★ 5.0</p>
        </section>
      </main>
    </div>

    <footer class="ft">
      <button>🏠</button>
      <button>⛺</button>
      <button>👤</button>
    </footer>
  </body>
</html>
