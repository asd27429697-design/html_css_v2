<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠핑 장소</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="content">
          <img src="https://picsum.photos/seed/camp5/250/250" alt="캠핑사진" />
          <h1>캠핑장</h1>
          <button class="btn">⌕</button>
        </div>
      </header>

      <main class="main-content">
        <div class="product-grid">
          <div class="filter-box">
            <h2>필터</h2>
            <span>⚙</span>
          </div>
          <p class="text">청결도순 ∨</p>
        </div>

        <div class="category-list">
          <div class="category-item">
            <span>🌲</span>
            <p>숲</p>
          </div>
          <div class="category-item">
            <span>🏊</span>
            <p>물놀이장</p>
          </div>
          <div class="category-item">
            <span>🏞️</span>
            <p>계곡 물놀이</p>
          </div>
          <div class="category-item">
            <span>🏖️</span>
            <p>해수욕</p>
          </div>
          <div class="category-item">
            <span>🚐</span>
            <p>차박</p>
          </div>
          <div class="category-item">
            <span>🐶</span>
            <p>반려동물</p>
          </div>
        </div>

        <div class="camp-list">
          <section class="camp-item">
            <div class="thumb"></div>
            <div class="info">
              <h3>엉클킴스</h3>
              <p class="address">경기 포천시 신북면 금동리 12-4</p>
              <p class="rating">★ 5.0</p>
            </div>
          </section>

          <section class="camp-item">
            <div class="thumb"></div>
            <div class="info">
              <h3>한국스카우트연맹 곤지암야영장</h3>
              <p class="address">경기 광주시 도척면 진우리 884</p>
              <p class="rating">★ 5.0</p>
            </div>
          </section>

          <section class="camp-item">
            <div class="thumb"></div>
            <div class="info">
              <h3>진천포레스트캠핑장</h3>
              <p class="address">충북 진천군 백곡면 구수리 82-25</p>
              <p class="rating">★ 5.0</p>
            </div>
          </section>

          <section class="camp-item">
            <div class="thumb"></div>
            <div class="info">
              <h3>트멍 캠핑장</h3>
              <p class="address">경기 포천시 소흘읍 무림리 94-1</p>
              <p class="rating">★ 5.0</p>
            </div>
          </section>
        </div>
      </main>

      <footer class="ft">
        <button>🏠</button>
        <button class="active">⛺</button>
        <button>👤</button>
      </footer>
    </div>
  </body>
</html>
